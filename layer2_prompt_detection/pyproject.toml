[project]
name = "sentinel-l2"
version = "0.1.0"
description = "SENTINEL Layer 2: malicious prompt (instruction-in-data) detector"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic>=2",
    "torch",
    "transformers>=4.40",
    "sentencepiece",
    "protobuf",
]
# The handbook says layers depend on sentinel_contracts only. Until contracts/ is frozen and installable,
# sentinel_l2/_contracts_fallback.py mirrors the handbook schemas (section 5.1).

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["sentinel_l2*"]
