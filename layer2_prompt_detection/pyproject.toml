[project]
name = "sentinel-l2"
version = "0.1.0"
description = "SENTINEL Layer 2: malicious prompt (instruction-in-data) detector"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "transformers>=4.40",
    "sentencepiece",
    "protobuf",
]
# Layers depend on sentinel_contracts only. Install it first, from the repo root:  pip install -e contracts

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-s"

[tool.setuptools.packages.find]
include = ["sentinel_l2*"]
