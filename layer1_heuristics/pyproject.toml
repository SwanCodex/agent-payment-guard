[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-l1"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "tldextract>=5.1",
]

[project.optional-dependencies]
train = [
    "requests>=2.31",
    "warcio>=1.7",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "pyyaml>=6.0",
]
pdf = ["pdfplumber", "pytesseract", "pillow"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["sentinel_l1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../contracts"]