log_amount:
  definition: log(1 + TransactionAmt)
  window: row
  source_columns:
  - TransactionAmt
  serving_available: true
  dtype: float64
  used_in_model: true
cents:
  definition: decimal part of the amount
  window: row
  source_columns:
  - TransactionAmt
  serving_available: true
  dtype: float64
  used_in_model: true
is_round_amount:
  definition: 1 if the amount has no cents
  window: row
  source_columns:
  - TransactionAmt
  serving_available: true
  dtype: int64
  used_in_model: true
hour:
  definition: relative hour of day from TransactionDT (reference start unknown)
  window: row
  source_columns:
  - TransactionDT
  serving_available: true
  dtype: int64
  used_in_model: true
dayofweek:
  definition: relative day of week from TransactionDT
  window: row
  source_columns:
  - TransactionDT
  serving_available: true
  dtype: int64
  used_in_model: true
addr1:
  definition: billing address code 1
  window: row
  source_columns:
  - addr1
  serving_available: true
  dtype: float64
  used_in_model: true
addr2:
  definition: billing address code 2
  window: row
  source_columns:
  - addr2
  serving_available: true
  dtype: float64
  used_in_model: true
dist1:
  definition: distance feature as provided
  window: row
  source_columns:
  - dist1
  serving_available: true
  dtype: float64
  used_in_model: true
has_identity:
  definition: 1 if the device type is known (the live replacement for 'identity row
    exists')
  window: row
  source_columns:
  - identity table
  serving_available: true
  dtype: int64
  used_in_model: true
ProductCD:
  definition: raw categorical ProductCD
  window: row
  source_columns:
  - ProductCD
  serving_available: true
  dtype: object
  used_in_model: true
card4:
